plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = mod_version
group = maven_group

base {
	archivesName = "${archives_base_name}-fabric-${minecraft_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/${archives_base_name}.accesswidener")
}

repositories {
	mavenLocal()

	// Parchment, Fabric
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.fabricmc.net" }
	maven { url = "https://jitpack.io/" }

	// AppleSkin
	maven { url = "https://maven.ryanliptak.com/" }

	// REI
	maven { url = "https://maven.shedaniel.me/" }

	// JEI
	maven { url = "https://maven.blamejared.com" }

	// TerraBlender
	maven { url = "https://maven.minecraftforge.net" }

	maven { url = "https://maven.architectury.dev/" }

	// GeckoLib
	maven {
		url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven"
		content {
			includeGroup "software.bernie.geckolib"
		}
	}

	// CorgiLib, Oh The Trees You'll Grow
	maven { url = "https://maven.jt-dev.tech/releases" }
	maven { url = "https://maven.jt-dev.tech/snapshots" }

	// CurseForge
	maven { url = "https://www.cursemaven.com" }

	// Modrinth
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

	// Parchment mappings
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_version}")
	}

	// Farmer's Delight Refabricated
	modImplementation "maven.modrinth:farmers-delight-refabricated:${minecraft_version}-${farmersdelight_version}"

	// JEI API
	modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

	// JEI
	modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

	// Appleskin
	modLocalRuntime("curse.maven:cloth-config-348521:5729125") // Appleskin requires Cloth Config
	modLocalRuntime("squeek.appleskin:appleskin-fabric:${appleskin_version}")

	// World-gen mods
	if (include_biomeswevegone.toBoolean() || include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_version}"
	}

	// Oh The Biomes We've Gone
	compileOnly "net.potionstudios:Oh-The-Biomes-Weve-Gone-Fabric:${biomeswevegone_version}"
	if (include_biomeswevegone.toBoolean()) {
		modLocalRuntime "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
		modLocalRuntime "dev.corgitaco:Corgilib-Fabric:${minecraft_version}-${corgilib_version}"
		modLocalRuntime "dev.corgitaco:Oh-The-Trees-Youll-Grow-fabric:${minecraft_version}-${ohthetreesyoullgrow_version}"
		modLocalRuntime "net.potionstudios:Oh-The-Biomes-Weve-Gone-Fabric:${biomeswevegone_version}"
	}

	// Biomes O' Plenty
	compileOnly "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	if (include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${glitchcore_version}"
		modLocalRuntime "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}