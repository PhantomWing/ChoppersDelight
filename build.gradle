plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

tasks.withType(Copy).configureEach {
    // Only override during runData execution
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mappings_channel, version: mappings_version

    copyIdeResources = true

    accessTransformer = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            property 'include_biomesoplenty', "true"
            property 'include_biomeswevegone', "true"
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // TerraBlender
    maven { url = "https://maven.minecraftforge.net" }

    // GeckoLib
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven" }

    // CorgiLib, Oh The Trees You'll Grow
    maven { url = "https://maven.jt-dev.tech/releases" }
    maven { url = "https://maven.jt-dev.tech/snapshots" }

    // AppleSkin
    maven { url = "https://maven.ryanliptak.com/" }

    // JEI (Progwml6 maven returns HTTP 523 and poisons ForgeGradle's deobf resolution; using ModMaven mirror only)
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven {
        name = "Greenhouse Maven"
        url = "https://maven.greenhouse.lgbt/releases"
    }

    // Modrinth Maven (Farmer's Delight)
    maven {
        url = "https://api.modrinth.com/maven"
    }

    // CurseMaven (Farmer's Delight CF artifacts, Every Compat, Selene)
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Farmer's Delight
    implementation fg.deobf("curse.maven:farmersdelight-398521:${farmersdelight_version}")

    // compile against the JEI API but do not include it at runtime
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // at runtime, use the full JEI jar for Forge
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Appleskin
    compileOnly fg.deobf("squeek.appleskin:appleskin-forge:${appleskin_version}:api")
    runtimeOnly fg.deobf("squeek.appleskin:appleskin-forge:${appleskin_version}")

    // World-gen mods
    if (include_biomeswevegone.toBoolean() || include_biomesoplenty.toBoolean()) {
        runtimeOnly fg.deobf("com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}")
    }

    // Oh The Biomes We've Gone
    compileOnly fg.deobf("net.potionstudios:Oh-The-Biomes-Weve-Gone-Forge:${biomeswevegone_version}")
    if (include_biomeswevegone.toBoolean()) {
        //implementation "com.eliotlash.mclib:mclib:20"
        //runtimeOnly "com.eliotlash.mclib:mclib:20"

        runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
        runtimeOnly fg.deobf("dev.corgitaco:Corgilib-Forge:${minecraft_version}-${corgilib_version}")
        runtimeOnly fg.deobf("dev.corgitaco:Oh-The-Trees-Youll-Grow-forge:${minecraft_version}-${ohthetreesyoullgrow_version}")
        runtimeOnly fg.deobf("net.potionstudios:Oh-The-Biomes-Weve-Gone-Forge:${biomeswevegone_version}")
    }

    // Biomes O' Plenty
    compileOnly "com.github.glitchfiend:BiomesOPlenty-forge:${minecraft_version}-${biomesoplenty_version}"
    if (include_biomesoplenty.toBoolean()) {
        runtimeOnly fg.deobf("com.github.glitchfiend:GlitchCore-forge:${minecraft_version}-${glitchcore_version}")
        runtimeOnly fg.deobf("com.github.glitchfiend:BiomesOPlenty-forge:${minecraft_version}-${biomesoplenty_version}")
    }

    // Every Compat
    compileOnly fg.deobf("curse.maven:every-compat-628539:7597912")
    compileOnly fg.deobf("curse.maven:selene-499980:7664875")
    if (include_everycompat.toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:every-compat-628539:7597912")
        runtimeOnly fg.deobf("curse.maven:selene-499980:7664875")
    }

    // Test (commented out — leftover test mods that cannot currently resolve via deobf cache)
    // implementation fg.deobf("curse.maven:autumnity-365045:6151402")
    // implementation fg.deobf("curse.maven:blueprint-382216:5292242")
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
    minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
    forge_version: forge_version, forge_version_range: forge_version_range,
    loader_version_range: loader_version_range,
    farmersdelight_version_range: farmersdelight_version_range,
    mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
    mod_authors: mod_authors, mod_description: mod_description
]

processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1", // We are version 1 of ourselves
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}