plugins {
	id 'fabric-loom' version '1.17.0-alpha.7'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.0.0'
}

version = mod_version
group = maven_group

tasks.withType(Copy).configureEach {
	// Only override during runData execution
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

base {
	archivesName.set("${mod_id}-fabric-${minecraft_version}")
}

repositories {
	mavenLocal()

	// Local patched FD Refabricated jar (loom 1.16+ classtweaker workaround)
	flatDir {
		dirs 'libs'
	}

	// Parchment, Fabric
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.fabricmc.net" }
	maven { url = "https://jitpack.io/" }

	// AppleSkin
	maven { url = "https://maven.ryanliptak.com/" }

	// REI
	maven { url = "https://maven.shedaniel.me/" }

	// JEI
	maven { url = "https://maven.blamejared.com" }

	// TerraBlender
	maven { url = "https://maven.minecraftforge.net" }

	maven { url = "https://maven.architectury.dev/" }

	// GeckoLib
	maven {
		url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven"
		content {
			includeGroup "software.bernie.geckolib"
		}
	}

	// CorgiLib, Oh The Trees You'll Grow
	maven { url = "https://maven.jt-dev.tech/releases" }
	maven { url = "https://maven.jt-dev.tech/snapshots" }

	// CurseForge
	maven { url = "https://www.cursemaven.com" }

	// Modrinth
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

fabricApi {
	configureDataGeneration {
		modId = mod_id
	}
}


dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// Parchment
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${minecraft_version}:${project.parchment_version}@zip")
	}

	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

	// Farmer's Delight Refabricated — local patched jar that strips classtweaker enum extensions
	// (those crash loom 1.16+ remap with NPE in EnumExtensionClassVisitor.visitEnd).
	// Ship this jar in `libs/` alongside the project; end users still install the unpatched jar at runtime.
	modImplementation(name: "farmers-delight-refabricated-${minecraft_version}-${farmersdelight_version}-patched") {
		exclude(group: "net.fabricmc")
	}

	// JEI API
	modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

	// JEI
	modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

	// Appleskin
	modLocalRuntime("curse.maven:cloth-config-348521:5729125") // Appleskin requires Cloth Config
	modLocalRuntime("squeek.appleskin:appleskin-fabric:${appleskin_version}")

	// World-gen mods
	if (include_biomeswevegone.toBoolean() || include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_version}"
	}

	// Oh The Biomes We've Gone
	compileOnly "net.potionstudios:Oh-The-Biomes-Weve-Gone-Fabric:${biomeswevegone_version}"
	if (include_biomeswevegone.toBoolean()) {
		modLocalRuntime "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
		modLocalRuntime "dev.corgitaco:Corgilib-Fabric:${minecraft_version}-${corgilib_version}"
		modLocalRuntime "dev.corgitaco:Oh-The-Trees-Youll-Grow-fabric:${minecraft_version}-${ohthetreesyoullgrow_version}"
		modLocalRuntime "net.potionstudios:Oh-The-Biomes-Weve-Gone-Fabric:${biomeswevegone_version}"
	}

	// Biomes O' Plenty
	compileOnly "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	if (include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${glitchcore_version}"
		modLocalRuntime "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	}

	// Every Compat (Wood Good) — needs Moonlight Lib
	modCompileOnly "maven.modrinth:moonlight:${moonlight_version}"
	modCompileOnly "maven.modrinth:every-compat:${everycompat_version}"
	if (include_everycompat.toBoolean()) {
		modLocalRuntime "maven.modrinth:moonlight:${moonlight_version}"
		modLocalRuntime "maven.modrinth:every-compat:${everycompat_version}"
	}
}

tasks.processResources {
	inputs.property("version", project.version)

	filesMatching("fabric.mod.json") {
		expand("version": project.version)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = mod_id
			from(components.java)
		}
	}

	repositories {
		// Add publishing repos here
	}
}

// The body under the first `# X.Y.Z` header of changelog.md, up to the next one.
ext.latestChangelog = {
	def f = file('changelog.md')
	if (!f.exists()) return "See changelog.md"
	def body = new StringBuilder()
	boolean started = false, done = false
	f.eachLine { line ->
		if (done) return
		if (line.startsWith('# ')) {
			if (started) { done = true; return }
			started = true
			return
		}
		if (started) body.append(line).append('\n')
	}
	def out = body.toString().trim()
	return out.isEmpty() ? "See changelog.md" : out
}

publishMods {
	// remapJar, not jar: the plain jar still carries named mappings and will not run in production.
	file = remapJar.archiveFile
	version = mod_version
	displayName = "${mod_name} ${mod_version}"
	changelog = latestChangelog()
	type = STABLE
	modLoaders.add("fabric")
	dryRun = project.hasProperty("publishDryRun")

	modrinth {
		projectId = providers.gradleProperty("modrinth_project_id")
		accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		requires("fabric-api")
		requires("farmers-delight-refabricated")
	}
	curseforge {
		projectId = providers.gradleProperty("curseforge_project_id")
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		// CurseForge needs explicit side flags (Modrinth infers them from the jar).
		client = true
		server = true
		requires("fabric-api")
		requires("farmers-delight-refabricated")
	}
}
