plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = mod_version
group = maven_group

base {
	archivesName.set("${mod_id}-fabric-${minecraft_version}")
}

repositories {
	mavenLocal()

	// Parchment, Fabric
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.fabricmc.net" }
	maven { url = "https://jitpack.io/" }

	// AppleSkin
	maven { url = "https://maven.ryanliptak.com/" }

	// REI
	maven { url = "https://maven.shedaniel.me/" }

	// JEI
	maven { url = "https://maven.blamejared.com" }

	// TerraBlender
	maven { url = "https://maven.minecraftforge.net" }

	maven { url = "https://maven.architectury.dev/" }

	// GeckoLib
	maven {
		url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven"
		content {
			includeGroup "software.bernie.geckolib"
		}
	}

	// CorgiLib, Oh The Trees You'll Grow
	maven { url = "https://maven.jt-dev.tech/releases" }
	maven { url = "https://maven.jt-dev.tech/snapshots" }

	// CurseForge
	maven { url = "https://www.cursemaven.com" }

	// Modrinth
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// Parchment
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${minecraft_version}:${project.parchment_version}@zip")
	}

	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

	// Farmer's Delight Refabricated
	modCompileOnly("maven.modrinth:farmers-delight-refabricated:${minecraft_version}-${farmersdelight_version}") {
		exclude(group: "net.fabricmc")
	}

	// JEI API
	modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

	// JEI
	modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

	// Appleskin
	modLocalRuntime("curse.maven:cloth-config-348521:5729125") // Appleskin requires Cloth Config
	modLocalRuntime("squeek.appleskin:appleskin-fabric:${appleskin_version}")

	// World-gen mods
	if (include_biomeswevegone.toBoolean() || include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_version}"
	}

	// Oh The Biomes We've Gone
	compileOnly "net.potionstudios:Oh-The-Biomes-Weve-Gone-Fabric:${biomeswevegone_version}"
	if (include_biomeswevegone.toBoolean()) {
		modLocalRuntime "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
		modLocalRuntime "dev.corgitaco:Corgilib-Fabric:${minecraft_version}-${corgilib_version}"
		modLocalRuntime "dev.corgitaco:Oh-The-Trees-Youll-Grow-fabric:${minecraft_version}-${ohthetreesyoullgrow_version}"
		modLocalRuntime "net.potionstudios:Oh-The-Biomes-Weve-Gone-Fabric:${biomeswevegone_version}"
	}

	// Biomes O' Plenty
	compileOnly "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	if (include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${glitchcore_version}"
		modLocalRuntime "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	}
}

tasks.processResources {
	inputs.property("version", project.version)

	filesMatching("fabric.mod.json") {
		expand("version": project.version)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = mod_id
			from(components.java)
		}
	}

	repositories {
		// Add publishing repos here
	}
}
