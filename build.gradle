plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.14'
}

tasks.withType(Copy).configureEach {
    // Only override during runData execution
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // CurseMaven
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.architectury.dev/" }

    // TerraBlender
    maven { url = "https://maven.minecraftforge.net" }

    // GeckoLib
    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven"
        content {
            includeGroup "software.bernie.geckolib"
        }
    }

    // CorgiLib, Oh The Trees You'll Grow
    maven { url = "https://maven.jt-dev.tech/releases" }
    maven { url = "https://maven.jt-dev.tech/snapshots" }

    // AppleSkin
    maven { url = "https://maven.ryanliptak.com" }

    // JEI
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://modmaven.dev" }

    mavenCentral()
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), "--existing-mod", "farmersdelight"
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Farmer's Delight
    implementation "curse.maven:farmers-delight-398521:${farmersdelight_version}"

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}" // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}" // at runtime, use the full JEI jar for NeoForge

    // Appleskin
    compileOnly "squeek.appleskin:appleskin-neoforge:${appleskin_version}:api"
    compileOnly "squeek.appleskin:appleskin-neoforge:${appleskin_version}"
    localRuntime "squeek.appleskin:appleskin-neoforge:${appleskin_version}"

    // World-gen mods
    if (include_biomeswevegone.toBoolean() || include_biomesoplenty.toBoolean()) {
        localRuntime "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
    }

    // Oh The Biomes We've Gone
    if (include_biomeswevegone.toBoolean()) {
        localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
        localRuntime "dev.corgitaco:Corgilib-NeoForge:${minecraft_version}-${corgilib_version}"
        localRuntime "dev.corgitaco:Oh-The-Trees-Youll-Grow-neoforge:"
    }
    implementation "net.potionstudios:Oh-The-Biomes-Weve-Gone-NeoForge:${biomeswevegone_version}"

    // Biomes O' Plenty
    if (include_biomesoplenty.toBoolean()) {
        localRuntime "com.github.glitchfiend:GlitchCore-neoforge:${minecraft_version}-${glitchcore_version}"
    }
    implementation "com.github.glitchfiend:BiomesOPlenty-neoforge:${minecraft_version}-${biomesoplenty_version}"

}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,

            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,

            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,

            farmersdelight_version_range: farmersdelight_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
