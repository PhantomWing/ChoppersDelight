plugins {
	id 'fabric-loom' version '1.17.0-alpha.7'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.0.0'
}

version = mod_version
group = maven_group

tasks.withType(Copy).configureEach {
	// Only override during runData execution
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

base {
	archivesName.set("${mod_id}-fabric-${minecraft_version}")
}

repositories {
	mavenLocal()

	// Parchment, Fabric
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.fabricmc.net" }
	maven { url = "https://jitpack.io/" }

	// Farmer's Delight Refabricated
	maven { url = "https://maven.greenhouse.lgbt/releases/" }

	// AppleSkin
	maven { url = "https://maven.ryanliptak.com/" }

	// Cloth Config
	maven { url = "https://maven.shedaniel.me/" }

	// TerraBlender
	maven { url = "https://maven.minecraftforge.net" }

	maven { url = "https://maven.architectury.dev/" }

}

fabricApi {
	configureDataGeneration {
		modId = mod_id
	}
}

loom {
	// The test source set is a mod of its own, choppersdelight_gametest, whose fabric.mod.json names the class that
	// registers the tests: an entrypoint in the shipped manifest would name a class the jar doesn't have.
	mods {
		register('choppersdelight_gametest') {
			sourceSet sourceSets.test
		}
	}

	runs {
		// Headless game-test server: runs the tests, prints PASS/FAIL, and exits. ./gradlew runGameTest
		gameTest {
			server()
			name = "Game Test"
			runDir "run/gametest"
			source sourceSets.test
			vmArg '-Dfabric-api.gametest'
		}
	}
}

// Test-only source set for game tests, kept out of `main` so nothing in it ships.
sourceSets {
	test {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}


dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${minecraft_version}"

	// Parchment
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${minecraft_version}:${project.parchment_version}@zip")
	}

	// Fabric
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

	// Farmer's Delight Refabricated
	modImplementation("vectorwing:FarmersDelight:${minecraft_version}-${farmersdelight_version}+refabricated") {
		exclude(group: "net.fabricmc")
	}

	// No JEI: Farmer's Delight Refabricated has no JEI integration on 1.21.6, so there is nothing for it to show.

	// Appleskin
	modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") { // Appleskin requires Cloth Config
		exclude(group: "net.fabricmc.fabric-api")
	}
	modLocalRuntime("squeek.appleskin:appleskin-fabric:${appleskin_version}")

	// World-gen mods
	if (include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_version}"
	}

	// Oh The Biomes We've Gone and Every Compat have no 1.21.6 build: their cutting boards stay out of
	// this line's dev runs, and their data loads only where the mod is installed.

	// Biomes O' Plenty
	compileOnly "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	if (include_biomesoplenty.toBoolean()) {
		modLocalRuntime "com.github.glitchfiend:GlitchCore-fabric:${minecraft_version}-${glitchcore_version}"
		modLocalRuntime "com.github.glitchfiend:BiomesOPlenty-fabric:${minecraft_version}-${biomesoplenty_version}"
	}
}

tasks.processResources {
	inputs.property("version", project.version)

	filesMatching("fabric.mod.json") {
		expand("version": project.version)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = mod_id
			from(components.java)
		}
	}

	repositories {
		// Add publishing repos here
	}
}

// The body under the first `# X.Y.Z` header of changelog.md, up to the next one.
ext.latestChangelog = {
	def f = file('changelog.md')
	if (!f.exists()) return "See changelog.md"
	def body = new StringBuilder()
	boolean started = false, done = false
	f.eachLine { line ->
		if (done) return
		if (line.startsWith('# ')) {
			if (started) { done = true; return }
			started = true
			return
		}
		if (started) body.append(line).append('\n')
	}
	def out = body.toString().trim()
	return out.isEmpty() ? "See changelog.md" : out
}

publishMods {
	// remapJar, not jar: the plain jar still carries named mappings and will not run in production.
	file = remapJar.archiveFile
	version = mod_version
	displayName = "${mod_name} ${mod_version}"
	changelog = latestChangelog()
	type = STABLE
	modLoaders.add("fabric")
	dryRun = project.hasProperty("publishDryRun")

	modrinth {
		projectId = providers.gradleProperty("modrinth_project_id")
		accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		requires("fabric-api")
		requires("farmers-delight-refabricated")
	}
	curseforge {
		projectId = providers.gradleProperty("curseforge_project_id")
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
		supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
		// CurseForge needs explicit side flags (Modrinth infers them from the jar).
		client = true
		server = true
		requires("fabric-api")
		requires("farmers-delight-refabricated")
	}
}
